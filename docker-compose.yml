services:
  db:
    image: postgres:16
    container_name: kallisto-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: <put-a-strong-random-password-here>
      POSTGRES_DB: admin_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # no ports: mapping — only reachable from other containers on kallisto_default network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: golang:1.25-alpine
    container_name: kallisto-migrate
    working_dir: /app
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: <put-a-strong-random-password-here>
    entrypoint: ["sh", "-c"]
    command:
      - >
        apk add --no-cache postgresql-client bash &&
        chmod +x scripts/db/*.sh &&
        bash scripts/db/bootstrap.sh --create-databases --seed-profile dev
        --database admin_db --db-user postgres --db-host db --db-port 5432

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: kallisto-backend
    restart: always
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgres://postgres:<put-a-strong-random-password-here>@db:5432/admin_db?sslmode=disable"
    ports:
      - "8081:8081"
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kallisto-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data: