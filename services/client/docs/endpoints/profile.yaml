openapi: 3.0.3
info:
  title: Kallisto Client Profile API
  version: 1.0.0
  description: Profile, security, and avatar endpoints for applicant accounts.

paths:
  /v1.0/profile:
    get:
      tags: [Client]
      summary: Get current user profile
      responses:
        '200':
          description: Profile payload
        '401':
          description: Unauthorized
    put:
      tags: [Client]
      summary: Update profile fields and merge JSONB profile data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                last_name:
                  type: string
                data:
                  type: object
      responses:
        '200':
          description: Profile updated
        '400':
          description: Validation error
        '401':
          description: Unauthorized
    delete:
      tags: [Client]
      summary: Delete current account profile
      responses:
        '200':
          description: Account deleted
        '401':
          description: Unauthorized

  /v1.0/profile/password:
    put:
      tags: [Client]
      summary: Change account password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: Password changed
        '400':
          description: Validation error
        '401':
          description: Current password invalid or unauthorized
        '404':
          description: User not found

  /v1.0/profile/photo:
    get:
      tags: [Client]
      summary: Get current profile avatar image bytes
      responses:
        '200':
          description: Binary image response
        '401':
          description: Unauthorized
        '404':
          description: No profile photo
    put:
      tags: [Client]
      summary: Upload current profile avatar image
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo:
                  type: string
                  format: binary
      responses:
        '200':
          description: Profile photo updated
        '400':
          description: Invalid file or payload too large
        '401':
          description: Unauthorized
