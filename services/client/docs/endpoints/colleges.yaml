paths:
  /colleges:
    get:
      tags: [Client]
      summary: Get list of available colleges
      responses:
        '200':
          description: List of colleges
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    name:
                      type: string
                    country:
                      type: string
                    ranking:
                      type: integer

  /colleges/{collegeId}:
    get:
      tags: [Client]
      summary: Get details of one college
      parameters:
        - name: collegeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: College info
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  description:
                    type: string
                  country:
                    type: string