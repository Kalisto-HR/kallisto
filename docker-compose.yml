services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-admin_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - kallisto

  migrator:
    image: postgres:16-alpine
    restart: "no"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-admin_db}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./scripts/migrations:/migrations:ro
    command:
      - sh
      - -c
      - psql "$$DATABASE_URL" -v ON_ERROR_STOP=1 -f /migrations/schema.sql
    networks:
      - kallisto

  university-seeder:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: "no"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-admin_db}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    command:
      - /app/import_universities
      - --data
      - /app/universities.v2.json
      - --database-url
      - postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-admin_db}?sslmode=disable
    networks:
      - kallisto

  admin-seeder:
    image: postgres:16-alpine
    restart: "no"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-admin_db}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
      university-seeder:
        condition: service_completed_successfully
    volumes:
      - ./scripts/seeds:/seeds:ro
    command:
      - sh
      - -c
      - psql "$$DATABASE_URL" -v ON_ERROR_STOP=1 -f /seeds/admin_seed.sql
    networks:
      - kallisto

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-admin_db}?sslmode=disable
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required and must be at least 32 characters}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://localhost:8082,https://kallisto.colab.duke.edu}
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      admin-seeder:
        condition: service_completed_successfully
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - kallisto

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_SESSION_IDLE_TIMEOUT_MINUTES: ${VITE_SESSION_IDLE_TIMEOUT_MINUTES:-60}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - kallisto

volumes:
  postgres_data:

networks:
  kallisto:
    driver: bridge
