openapi: 3.0.3
info:
  title: Kallisto Backend API
  version: 1.0.0
  description: OpenAPI 3.0 documentation


paths:
  /v1.0/applicants:
    get:
      tags: [Admin]
      summary: List applicants
      responses:
        '200':
          description: Applicant list

  /v1.0/applicants/{user_uid}:
    get:
      tags: [Admin]
      summary: Get applicant profile
    parameters:
        - name: user_uid
          in: path
          required: true
          schema:
            type: string

  /v1.0/applicants/{user_uid}/ban:
    post:
      tags: [Admin]
      summary: Ban applicant
       parameters:
        - name: user_uid
          in: path
          required: true
          schema:
            type: string

  /v1.0/applicants/{user_uid}/unban:
    post:
      tags: [Admin]
      summary: Unban applicant
      parameters:
        - name: user_uid
          in: path
          required: true
          schema:
            type: string
